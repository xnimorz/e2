# Publishes e2 and eslint-plugin-e2 to npm when a version tag is pushed.
# `bun run release` verifies everything locally and pushes the tag.
#
# One-time setup, either of:
#   - npm trusted publishing (no secret): on npmjs.com, for each package, add a
#     trusted publisher for xnimorz/e2, workflow release.yml, environment npm.
#     A package must exist before this can be set, so a first publish needs the token.
#   - an npm automation token in the repository secret NPM_TOKEN.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release script checks the tag is on master
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run release --ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
